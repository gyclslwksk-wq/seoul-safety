function unlockVoice(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}
function synth(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=1.05;u.onstart=()=>{const b=document.getElementById('stopv');if(b)b.hidden=false;};u.onend=()=>{const b=document.getElementById('stopv');if(b)b.hidden=true;};speechSynthesis.speak(u);}catch(e){}}
function say(t){t=t.replace(/119/g,'일일구');lastLine=t;if(!S.voice)return;if(TTS){TTS.speak(t,{language:'ko'}).catch(e=>{if(e&&['not_granted','unavailable','upstream_error'].includes(e.code))synth(t);});return;}synth(t);}

 if(DIC){DIC.start({language:'ko-KR'}).catch(e=>micErr(e&&e.code==='not_granted'?'마이크 사용이 허용되지 않았어요. 보기를 눌러 대답해 주세요.':'마이크를 시작하지 못했어요. 다시 눌러 보세요.'));listening=true;micBtn();showHeard();return;}

 if(beat===0){if(!/불|화재|연기|타고/.test(z))miss.push('불이 났다는 사실');ask='무슨 일인지 말씀해 주세요. 불이 났나요?';}
 if(beat===1){const city=(SITE.addr.match(/([가-힣]+)(시|군|구)\b/)||[])[1];const nums=((SITE.addr+' '+SITE.bld).match(/\d+/g)||[]);const hit=nums.filter(n=>d.includes(n)).length;
  if(city&&!z.includes(city))miss.push('도시·도로명 주소');if(hit<Math.min(3,nums.length))miss.push('번지와 동·호수');ask='도로명 주소와 동, 호수까지 정확히 말씀해 주세요.';}
 if(beat===2){if(!/분전반|전기|전선|콘센트|멀티탭|기계|설비|배전|차단기/.test(z))miss.push('무엇이 타는지');if(!/미터|m|센티|크|작|높|연기|불꽃|번지|퍼지/.test(z))miss.push('불의 크기·연기');ask='무엇이 타고 있는지, 불이나 연기가 얼마나 큰지 말씀해 주세요.';}
 if(beat===3){if(!/다친|부상|기침|쓰러|없|대피|남아|모르|확인|명/.test(z))miss.push('다친 사람·남은 사람');ask='다친 분이나 안에 남은 분이 있는지 말씀해 주세요.';}
 if(beat===4){if(!(dig.length>=10||/공일공|영일영/.test(z)))miss.push('연락처');if(!/축평|평가|입니다|이에요|예요|이고|저는|이름/.test(z))miss.push('이름');ask='성함과 휴대폰 번호를 말씀해 주세요.';}
 if(beat===5){if(/끊|들어가|가져/.test(z))miss.push('끊지 않고 안전한 곳에서 기다리기');else if(!/대피|밖|주차장|안전|기다|나와|나왔|앞/.test(z))miss.push('지금 있는 안전한 장소');ask='전화 끊지 마시고, 지금 계신 곳이 안전한지 말씀해 주세요.';}
 return {ok:!miss.length,miss,ask};}
function evalSpeech(){const t=(heard+' '+heardPartial).trim();heard='';heardPartial='';
 if(!t){micErr('아무 말도 들리지 않았어요. 다시 눌러 말해 보세요.');return;}
 const r=judge(S.call.beat,t);
 respond('🎤 '+t,r.ok,r.ok?'좋아요! 말로도 필요한 내용을 정확히 신고했어요.':`빠진 내용: <b>${r.miss.join(', ')}</b>. 상황실 질문을 듣고 다시 말해 보세요.`,r.ok?null:r.ask,false);}
function scrollChat(){const ch=document.getElementById('chat');if(ch)ch.scrollTop=ch.scrollHeight;}

function render(){renderRail();const st=document.getElementById('stage');st.innerHTML=V[STEPS[S.cur].k]();
 const $=id=>document.getElementById(id);
 if($('prev'))$('prev').onclick=()=>go(S.cur-1);
 if($('next'))$('next').onclick=()=>{if(canLeave(S.cur))go(S.cur+1);};
 if($('restart'))$('restart').onclick=()=>{stopT();S=init();render();};
 ['name','addr','bld','where','meet','tel'].forEach(k=>{const el=$('s_'+k);if(el)el.oninput=()=>{SITE[k]=el.value;try{localStorage.setItem('call119site2',JSON.stringify(SITE))}catch(e){}buildBeats();
  const pv=$('preview');if(pv)pv.textContent=SITE.addr?'"'+`${SITE.addr}, ${SITE.bld?SITE.bld+' ':''}${SITE.name}`+'이에요."':'(주소를 적으면 여기에 나와요)';
  const ok=canLeave(S.cur);const n=$('next');if(n)n.disabled=!ok;const tk=$('sitetask');if(tk)tk.innerHTML=task('작업장 이름과 주소를 적어 주세요',ok);renderRail();};});
 if($('ex'))$('ex').onclick=()=>{SITE=Object.assign({},EX);try{localStorage.setItem('call119site2',JSON.stringify(SITE))}catch(e){}buildBeats();render();};
 st.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const i=+b.dataset.b;if(i===S.before.length){S.before.push(i);render();}else shake(b);});
 st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const c=S.call,k=b.dataset.k;
  if(k==='del'){c.num=c.num.slice(0,-1);c.err='';render();return;}
  if(k==='call'){if(c.num==='119'){c.err='';unlockVoice();startCall();}else{c.err=c.num?`${c.num}은(는) 화재 신고 번호가 아니에요. 화재·구급은 <b>119</b>예요.`:'번호를 먼저 누르세요.';c.num='';render();}return;}
  if(c.num.length<6){c.num+=k;const f=DTMF[k];if(f)tone(f,.12,.06);c.err='';render();}});
 st.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>answer(+b.dataset.c));
 if($('mic'))$('mic').onclick=micToggle;
 if($('replay'))$('replay').onclick=()=>{if(lastLine){const v=S.voice;S.voice=true;say(lastLine);S.voice=v;}};
 if($('stopv'))$('stopv').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}try{TTS&&TTS.stop()}catch(e){}$('stopv').hidden=true;};
 if($('again'))$('again').onclick=()=>{stopT();S.call=init().call;render();};
 if($('voice'))$('voice').onchange=e=>{S.voice=e.target.checked;if(!S.voice)try{speechSynthesis.cancel()}catch(x){}};
 const nm=$('nm');if(nm)nm.oninput=()=>{S.name=nm.value.trim();$('nmv').textContent=S.name?'이수자 '+S.name:'';};
 scrollChat();
}
render();
</script>
