<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: team-facilitation tool in the series stage format; each role keeps one color everywhere (cards, chips, board) */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --fg:#1b2233; --muted:#5b6478; --sunk:#f6f8fb;
  --navy:#1b2f5c; --navy-ink:#ffffff; --yellow:#f6c418; --yellow-soft:#fff4c7; --blue:#3d7fd0; --line:#d9dfea;
  --good:#1f9d5c; --good-soft:#e2f6ea; --bad:#d8392b; --bad-soft:#fde6e3;
  --r1:#d98a00; --r1-soft:#fff1d6;   /* 상황전파 */
  --r2:#1f9d5c; --r2-soft:#e2f6ea;   /* 대피유도 */
  --r3:#d8392b; --r3-soft:#fde6e3;   /* 초기대응 */
  --r4:#2f6fd0; --r4-soft:#e3edfb;   /* 응급지원 */
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151d; --surface:#1b212c; --fg:#e9edf5; --muted:#a2abbd; --sunk:#151a23;
  --navy:#3d5a95; --navy-ink:#ffffff; --yellow:#f6c418; --yellow-soft:#3a3214; --blue:#78aaf0; --line:#2e3646;
  --good:#4cc887; --good-soft:#163a29; --bad:#ff7466; --bad-soft:#41201d;
  --r1:#f2b14a; --r1-soft:#3b2d14; --r2:#4cc887; --r2-soft:#163a29; --r3:#ff7466; --r3-soft:#41201d; --r4:#78aaf0; --r4-soft:#1b2c47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1b212c; --fg:#e9edf5; --muted:#a2abbd; --sunk:#151a23;
  --navy:#3d5a95; --navy-ink:#ffffff; --yellow:#f6c418; --yellow-soft:#3a3214; --blue:#78aaf0; --line:#2e3646;
  --good:#4cc887; --good-soft:#163a29; --bad:#ff7466; --bad-soft:#41201d;
  --r1:#f2b14a; --r1-soft:#3b2d14; --r2:#4cc887; --r2-soft:#163a29; --r3:#ff7466; --r3-soft:#41201d; --r4:#78aaf0; --r4-soft:#1b2c47; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;display:flex;align-items:center;gap:10px}
.brand .tag{background:var(--bad);color:#fff;font-size:.8rem;padding:3px 10px;border-radius:999px;font-family:var(--body);font-weight:700}
.org{font-size:.85rem;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:500}
.rail button[disabled]{cursor:not-allowed;opacity:.55}
.rail .bar{height:6px;border-radius:3px;background:var(--line)}
.rail button.done .bar{background:var(--navy)}
.rail button.cur .bar{background:var(--yellow)}
.rail button.cur{color:var(--fg);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
@media (max-width:620px){.rail span.l{display:none}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hero{display:block;width:100%;aspect-ratio:1672/941;object-fit:cover;max-width:100%;background:var(--line)}
.panel{padding:22px clamp(16px,4vw,32px) 26px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--blue)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.3;margin:0;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 2px}
h3{margin:0;font-size:1rem}
p{margin:0;max-width:65ch}
.lead{color:var(--muted)}
.task{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;background:var(--yellow-soft);border-radius:10px;padding:8px 12px;width:fit-content;max-width:100%}
.task::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none}
.task.ok{background:var(--good-soft)} .task.ok::before{background:var(--good)}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
.note b{color:var(--fg)}
.fb{font-size:.9rem;padding:10px 12px;border-radius:10px;line-height:1.55}
.fb.good{background:var(--good-soft)} .fb.badf{background:var(--bad-soft)}
/* role colors */
.r1{--rc:var(--r1);--rs:var(--r1-soft)} .r2{--rc:var(--r2);--rs:var(--r2-soft)} .r3{--rc:var(--r3);--rs:var(--r3-soft)} .r4{--rc:var(--r4);--rs:var(--r4-soft)}
.ico{width:40px;height:40px;flex:none;border-radius:10px;background:var(--rs);display:grid;place-items:center}
.ico svg{width:24px;height:24px}
/* flip role cards */
.rcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.rcard{all:unset;cursor:pointer;perspective:900px;display:block;min-height:250px}
.rcard:focus-visible .in{outline:3px solid var(--blue);outline-offset:3px}
.rcard .in{position:relative;height:100%;min-height:250px;transition:transform .5s;transform-style:preserve-3d;border-radius:14px}
.rcard.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.front{background:var(--surface);border:3px solid var(--rc);align-items:center;justify-content:center;text-align:center}
.front .ico{width:72px;height:72px;border-radius:18px}
.front .ico svg{width:44px;height:44px}
.front .t{font-family:var(--display);font-size:1.5rem;color:var(--fg)}
.front .s{font-size:.82rem;color:var(--muted)}
.back{background:var(--rs);border:3px solid var(--rc);transform:rotateY(180deg);font-size:.86rem;line-height:1.5;overflow:auto;color:var(--fg)}
.back b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--rc)}
.back ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
/* sort game */
.bins{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.bins{grid-template-columns:repeat(2,1fr)}}
.bin{all:unset;cursor:pointer;border:2px dashed var(--rc);background:var(--rs);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:120px;min-width:0}
.bin:focus-visible{outline:3px solid var(--blue)}
.bin.armed{border-style:solid;box-shadow:0 0 0 3px var(--rc) inset}
.bin .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.bin .h .ico{width:28px;height:28px;border-radius:8px;background:var(--surface)}
.bin .h .ico svg{width:18px;height:18px}
.bin .it{font-size:.8rem;background:var(--surface);border-radius:8px;padding:5px 8px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:9px 13px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:.9rem;font-weight:500}
.chip:hover{border-color:var(--blue)}
.chip:focus-visible{outline:3px solid var(--blue)}
.chip.sel{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.score{display:flex;gap:16px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg)}
/* scenario */
.alarm{border-radius:14px;padding:16px;background:var(--bad-soft);border:2px solid var(--bad);display:flex;gap:12px;align-items:flex-start}
.alarm .dot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--bad);margin-top:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pbtn{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;font-weight:700;background:var(--surface)}
.pbtn:hover{border-color:var(--rc)}
.pbtn:focus-visible{outline:3px solid var(--blue)}
.pbtn.on{border-color:var(--rc);background:var(--rs)}
.beat{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.beat .time{font-size:.78rem;font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;padding:10px 14px;border-radius:10px;border:2px solid var(--line);font-weight:500;background:var(--surface);font-size:.92rem;line-height:1.5}
.opt:hover{border-color:var(--blue)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
/* discussion */
.disc{display:flex;flex-direction:column;gap:12px}
.dq{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dq .q{font-weight:700}
.dq .q small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
textarea,input[type=text],select{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
textarea{min-height:64px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue)}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.timer .tv{font-family:var(--display);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
/* board */
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:700;color:var(--muted)}
.assign{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.as{border:2px solid var(--rc);background:var(--rs);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.as .h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.15rem}
.as .h .ico{background:var(--surface)}
.as label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
.as input{background:var(--surface)}
.preview{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--sunk);overflow-x:auto}
.preview canvas{display:block;width:100%;max-width:100%;height:auto;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.nav{display:flex;justify-content:space-between;gap:10px;padding:14px clamp(16px,4vw,32px);border-top:1px solid var(--line)}
.btn{all:unset;cursor:pointer;padding:11px 20px;border-radius:12px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--navy);color:var(--navy-ink)}
.btn.pri[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{color:var(--muted)}
.btn.ghost[disabled]{visibility:hidden}
.btn.y{background:var(--yellow);color:#1b2233}
.btn.line{border:2px solid var(--line);color:var(--fg)}
.btn.sm{padding:7px 14px;font-size:.85rem}
.summary{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0;padding:0;list-style:none}
.summary li{border-radius:10px;padding:10px 12px;font-size:.9rem;background:var(--rs);border-left:0}
.summary li b{display:block;color:var(--rc);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

 r3:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="8" width="8" height="13" rx="3"/><path d="M11 8V5h3l4 2M9 5h5"/></svg>',

 {k:'r1',n:'상황전파',s:'즉시 알리고 상황 공유',d:['"불이야!" 외치고 비상벨 누르기','119에 위치·상황·인원 신고','도축장 관리자·지원장에게 보고','상황이 바뀌면 계속 공유']},
 {k:'r2',n:'대피유도',s:'안전한 대피 안내',d:['비상구를 열고 대피로 안내','엘리베이터 말고 계단으로','거동이 불편한 사람 함께 대피','집결지에서 인원 확인, 누락자 보고']},
 {k:'r3',n:'초기대응',s:'화재 등 초기 조치',d:['가까운 소화기로 초기 진압','안전할 때만 전원·가스 차단','불이 커지면 즉시 중단하고 대피','소방대에 발화 위치·상황 알려 주기']},
 {k:'r4',n:'응급지원',s:'부상자 확인 및 응급조치',d:['부상자 의식·호흡 확인','심폐소생술·AED 사용','출혈은 압박해서 지혈','구급대에 부상자 상태 전달']}

const ACTS=[
 ['비상벨을 누르고 "불이야!" 외치기','r1'],['119에 위치·상황·인원 신고','r1'],['지원장·도축장 관리자에게 보고','r1'],
 ['비상구 문을 열고 대피로 안내','r2'],['엘리베이터 대신 계단으로 안내','r2'],['집결지에서 인원 확인 후 누락자 보고','r2'],
 ['소화기로 초기 화재 진압','r3'],['안전할 때만 전원·가스 차단','r3'],['불이 커지면 진압 중단하고 대피','r3'],
 ['쓰러진 사람 의식·호흡 확인','r4'],['심폐소생술과 AED 사용','r4'],['출혈 부위 압박 지혈','r4']
];
const ORDER=[6,1,10,3,8,0,11,5,2,9,4,7];
const SCEN={
 intro:'오전 6시 40분, 냉각실 옆 기계실에서 연기가 새어 나오고 화재경보가 울린다. 판정 작업 중이던 평가사 3명과 도축장 직원 10여 명이 근처에 있고, 기계실 앞에 직원 1명이 연기를 마시고 주저앉아 있다.',
 r1:[{t:'경보 직후',q:'가장 먼저 할 일은?',o:['기계실 안을 직접 들어가 원인을 확인한다','"불이야!" 크게 외치고 비상벨을 누른다','지원장에게 문자로 보고한다'],a:1,e:'주변 모두가 알아야 대피가 시작돼요. 소리와 비상벨이 먼저예요.'},
  {t:'1분 뒤',q:'119에 신고할 때 꼭 말해야 하는 것은?',o:['"불났어요!"만 말하고 끊는다','도축장 이름·주소, 불난 위치, 부상자 수를 차분히 말한다','소방서 번호를 검색한다'],a:1,e:'어디서, 무엇이, 몇 명이 다쳤는지가 핵심이에요. 끊으라고 할 때까지 끊지 않아요.'},
  {t:'3분 뒤',q:'신고 후 다음 행동은?',o:['내 일은 끝났으니 먼저 퇴근한다','지원장과 도축장 관리자에게 보고하고, 바뀌는 상황을 계속 공유한다','SNS에 현장 사진을 올린다'],a:1,e:'상황전파는 한 번으로 끝나지 않아요. 상황이 바뀔 때마다 계속 알려요.'}],
 r2:[{t:'경보 직후',q:'가장 먼저 할 일은?',o:['짐을 챙긴다','가까운 비상구를 열고 "이쪽으로!" 대피로를 안내한다','엘리베이터를 잡아 둔다'],a:1,e:'대피로를 열고 사람들을 이끄는 것이 대피유도의 시작이에요.'},
  {t:'1분 뒤',q:'연기가 복도로 번지고 있다면?',o:['자세를 낮추고 코와 입을 막고 벽을 따라 이동하도록 안내한다','뛰어서 빨리 나가라고 한다','연기가 빠질 때까지 기다리게 한다'],a:0,e:'연기는 위로 차요. 낮은 자세로, 코와 입을 막고 이동해요.'},
  {t:'집결지 도착',q:'집결지에서 할 일은?',o:['도착했으니 해산한다','인원을 세어 보고 없는 사람이 있으면 바로 상황전파 담당과 소방대에 알린다','없는 사람을 찾으러 혼자 다시 들어간다'],a:1,e:'누락자 확인과 보고가 대피유도의 마지막 임무예요. 다시 들어가는 건 소방대의 몫이에요.'}],
 r3:[{t:'경보 직후',q:'기계실 문틈으로 연기만 보인다면?',o:['문을 활짝 열고 들어간다','가까운 소화기를 가져와 출구를 등지고 선 뒤, 불의 크기를 확인한다','물을 양동이로 뿌린다'],a:1,e:'출구를 등 뒤에 두고, 끌 수 있는 불인지부터 확인해요. 기계실은 전기 설비가 많아 물은 위험해요.'},
  {t:'1분 뒤',q:'전기 차단기가 불 반대편 안전한 곳에 있다면?',o:['안전하다면 전원을 차단한다','불 쪽으로 넘어가서라도 차단한다','손대지 않는다'],a:0,e:'안전이 확보된 경우에만 차단해요. 위험을 무릅쓰지 않아요.'},
  {t:'2분 뒤',q:'소화기를 다 썼는데 불이 천장까지 번졌다면?',o:['다른 소화기를 가지러 안쪽으로 들어간다','즉시 진압을 멈추고 대피한 뒤, 도착한 소방대에 발화 위치를 알려 준다','계속 버틴다'],a:1,e:'초기대응은 초기까지만이에요. 커진 불은 대피가 먼저예요.'}],
 r4:[{t:'경보 직후',q:'주저앉은 직원에게 가장 먼저 할 일은?',o:['그 자리에서 바로 심폐소생술을 시작한다','연기가 없는 안전한 곳으로 함께 옮긴다','물을 마시게 한다'],a:1,e:'구조하는 사람도 안전해야 해요. 연기 없는 곳으로 먼저 옮겨요.'},
  {t:'1분 뒤',q:'불러도 반응이 없고 숨을 제대로 쉬지 않는다면?',o:['깨어날 때까지 기다린다','주변에 119 신고와 AED를 요청하고 바로 가슴압박을 시작한다','흔들어 깨운다'],a:1,e:'반응과 정상 호흡이 없으면 즉시 심폐소생술이에요. 신고와 AED는 다른 사람에게 부탁해요.'},
  {t:'구급대 도착',q:'구급대가 도착하면?',o:['말없이 자리를 비켜 준다','언제 쓰러졌는지, 어떤 처치를 했는지 알려 준다','병원까지 따라간다'],a:1,e:'쓰러진 시각과 한 처치를 알려 주면 이후 치료에 도움이 돼요.'}]
};
const DISC=[
 ['우리 작업장의 비상구와 대피 집결지는 어디인가요?','도축장마다 다르니 지도를 그려 보거나 직접 걸어가 봐요.'],
 ['소화기와 AED는 어디에 있나요?','판정실·냉각실에서 가장 가까운 위치를 확인해요. AED가 없다면 가장 가까운 곳이 어디인지도요.'],
 ['담당자가 자리에 없으면 누가 대신하나요?','휴가·출장·교대 근무를 생각해서 대리자를 정해요.'],
 ['도축장 직원들과는 어떻게 연락하고 협조하나요?','우리는 도축장 소속이 아니라서, 도축장 비상연락망과 담당자를 미리 알아 둬야 해요.']
];
const STEPS=[{k:'intro',label:'시작'},{k:'cards',label:'임무카드'},{k:'sort',label:'임무 맞추기'},{k:'scen',label:'시나리오 훈련'},{k:'disc',label:'팀 토론'},{k:'board',label:'임무 배정표'},{k:'end',label:'마무리'}];
const init=()=>({cur:0,max:0,cards:[false,false,false,false],sort:{placed:{},sel:null,miss:0},scen:{role:null,ans:{},done:{}},disc:['','','',''],board:{site:'',meet:'',ext:'',aed:'',tel:'',r:{r1:['',''],r2:['',''],r3:['',''],r4:['','']}}});
let S=init();
function canLeave(i){const k=STEPS[i].k;
 if(k==='cards')return S.cards.every(Boolean);
 if(k==='sort')return Object.keys(S.sort.placed).length===ACTS.length;
 if(k==='scen')return Object.keys(S.scen.done).length>=1;
 if(k==='board')return boardOK();
 return true;}
function boardOK(){const b=S.board;return b.site.trim()&&ROLES.every(r=>b.r[r.k][0].trim());}
let timer=null;
function go(i){if(timer){clearInterval(timer);timer=null;}S.cur=i;S.max=Math.max(S.max,i);render();document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'start'});}
function renderRail(){const r=document.getElementById('rail');
 r.innerHTML=STEPS.map((s,i)=>`<button role="tab" aria-selected="${i===S.cur}" class="${i===S.cur?'cur':(i<S.max?'done':'')}" ${i>S.max?'disabled':''} data-i="${i}"><span class="bar"></span><span class="l">${s.label}</span></button>`).join('');
 r.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function nav(label){const ok=canLeave(S.cur),last=S.cur===STEPS.length-1;
 return `<nav class="nav"><button class="btn ghost" id="prev" ${S.cur===0?'disabled':''}>← 이전</button>${last?'<button class="btn ghost" id="restart">처음부터 다시</button>':`<button class="btn ${S.cur===0?'y':'pri'}" id="next" ${ok?'':'disabled'}>${label||'다음 →'}</button>`}</nav>`;}
function refreshNext(){const n=document.getElementById('next');if(n)n.disabled=!canLeave(S.cur);}
const task=(t,ok)=>`<div class="task ${ok?'ok':''}">${ok?'완료! 다음 단계로 넘어갈 수 있어요':t}</div>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon=k=>`<span class="ico" style="color:var(--rc)">${SVG[k]}</span>`;

const V={
intro(){return `<img class="hero" src="${IMG.cover}" alt="비상시 임무카드: 상황전파, 대피유도, 초기대응, 응급지원">
 <div class="panel"><div class="eyebrow">4월 보너스 교육 · 비상대응 훈련 · 작업장별 팀 활동 · 약 25분</div>

cards(){const ok=canLeave(1);

 <div class="panel"><div class="eyebrow">1. 임무카드</div>
 <h2>각자의 임무를 확인하고 <em>신속하게</em> 행동해요</h2>
 ${task('카드 네 장을 모두 뒤집어 임무를 확인하세요',ok)}

  <div class="face front">${icon(r.k)}<span class="t">${r.n}</span><span class="s">${r.s}</span><span class="s" style="color:var(--rc);font-weight:700">눌러서 뒤집기</span></div>
  <div class="face back"><b>${r.n}</b><ul>${r.d.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></button>`).join('')}</div>
 </div>${nav()}`;},

sort(){const s=S.sort,ok=canLeave(2),left=ORDER.filter(i=>s.placed[i]===undefined);
 return `<div class="panel"><div class="eyebrow">2. 임무 맞추기 게임</div>
 <h2>이 행동은 <em>누구의 임무</em>일까요?</h2>
 <p class="lead">아래 행동 카드를 하나 누른 뒤, 알맞은 임무 칸을 누르세요. 팀원이 돌아가며 한 장씩 맞혀 보세요.</p>
 ${task('행동 카드 12장을 모두 알맞은 임무에 넣으세요',ok)}
 <div class="score"><span>남은 카드 <b>${left.length}</b></span><span>틀린 횟수 <b>${s.miss}</b></span></div>
 <div class="bins">${ROLES.map(r=>`<button class="bin ${r.k} ${s.sel!==null?'armed':''}" data-b="${r.k}" aria-label="${r.n} 칸에 넣기"><span class="h">${icon(r.k)}${r.n}</span>${ACTS.map((a,i)=>s.placed[i]===r.k?`<span class="it">${a[0]}</span>`:'').join('')}</button>`).join('')}</div>
 ${left.length?`<div class="chips">${left.map(i=>`<button class="chip ${s.sel===i?'sel':''}" data-a="${i}" aria-pressed="${s.sel===i}">${ACTS[i][0]}</button>`).join('')}</div>`:`<div class="fb good">모두 맞혔어요! 틀린 횟수 ${s.miss}번. ${s.miss===0?'완벽해요.':'헷갈렸던 임무는 팀에서 한 번 더 이야기해 보세요.'}</div>`}
 </div>${nav()}`;},

scen(){const sc=S.scen,role=sc.role,ok=canLeave(3);
 let body='';
 if(role){const beats=SCEN[role];const ans=sc.ans[role]||{};
  let shown=0;for(let i=0;i<beats.length;i++){shown=i;if(ans[i]!==beats[i].a)break;shown=i+1;}
  body=beats.slice(0,Math.min(shown+1,beats.length)).map((b,i)=>{const a=ans[i],r=a===b.a;return `<div class="beat"><span class="time">⏱ ${b.t}</span><b>${b.q}</b>
   <div class="opts">${b.o.map((o,j)=>`<button class="opt ${a===j?(r?'right':'wrong'):''}" data-q="${i}" data-v="${j}" ${r?'disabled':''}>${o}</button>`).join('')}</div>
   ${a!==undefined?`<div class="fb ${r?'good':'badf'}">${r?b.e:'다시 골라 보세요. 내 임무와 내 안전을 함께 생각해요.'}</div>`:''}</div>`;}).join('');
  if(shown>=beats.length)body+=`<div class="fb good"><b>${ROLES.find(r=>r.k===role).n} 임무 완료!</b> 다른 임무도 골라서 해 보세요. 팀원마다 다른 역할로 해 보면 서로의 임무를 이해할 수 있어요.</div>`;
 }
 return `<div class="panel"><div class="eyebrow">3. 비상 시나리오 훈련</div>
 <h2>경보가 울렸어요. <em>내 임무대로</em> 움직여 보세요</h2>
 <div class="alarm"><span class="dot"></span><div><b>상황 발생</b><br>${SCEN.intro}</div></div>
 ${task('임무를 하나 골라 끝까지 대응해 보세요',ok)}
 <div class="pick">${ROLES.map(r=>`<button class="pbtn ${r.k} ${role===r.k?'on':''}" data-r="${r.k}">${icon(r.k)}<span>${r.n}${sc.done[r.k]?' ✓':''}</span></button>`).join('')}</div>
 ${body}
 </div>${nav()}`;},

disc(){return `<div class="panel"><div class="eyebrow">4. 팀 토론</div>
 <h2>우리 작업장이라면? <em>함께 이야기해요</em></h2>
 <p class="lead">질문마다 3분씩 이야기하고, 정한 내용을 적어 두세요. 적은 내용은 다음 단계의 임무 배정표에 활용돼요. 이 화면에 적은 내용은 저장되지 않으니 활동이 끝나면 배정표 이미지로 남겨 주세요.</p>
 <div class="timer"><span class="tv" id="tv">3:00</span><button class="btn sm pri" id="tstart">3분 타이머 시작</button><button class="btn sm line" id="treset">초기화</button></div>
 <div class="disc">${DISC.map((d,i)=>`<div class="dq"><label class="q" for="d${i}">${i+1}. ${d[0]}<small>${d[1]}</small></label><textarea id="d${i}" data-d="${i}" placeholder="우리 팀이 정한 내용">${esc(S.disc[i])}</textarea></div>`).join('')}</div>
 </div>${nav()}`;},

board(){const b=S.board,ok=canLeave(5);
 return `<div class="panel"><div class="eyebrow">5. 우리 작업장 임무 배정표</div>
 <h2>임무카드를 <em>나눠 맡아요</em></h2>
 <p class="lead">작업장 정보와 임무별 담당자·대리자를 적으면 배정표가 만들어져요. 이미지로 저장해 단톡방에 공유하거나 출력해 게시하세요.</p>
 ${task('작업장 이름과 네 임무의 담당자를 모두 적으세요',ok)}
 <div class="form">
  <label>작업장(도축장) 이름<input type="text" id="b_site" value="${esc(b.site)}" placeholder="예: OO도축장"></label>
  <label>대피 집결지<input type="text" id="b_meet" value="${esc(b.meet)}" placeholder="예: 정문 앞 주차장"></label>
  <label>소화기 위치<input type="text" id="b_ext" value="${esc(b.ext)}" placeholder="예: 판정실 입구 왼쪽"></label>
  <label>AED 위치<input type="text" id="b_aed" value="${esc(b.aed)}" placeholder="예: 사무동 1층 로비"></label>
  <label>비상연락처<input type="text" id="b_tel" value="${esc(b.tel)}" placeholder="예: 지원장 010-0000-0000"></label>
 </div>
 <div class="assign">${ROLES.map(r=>`<div class="as ${r.k}"><span class="h">${icon(r.k)}${r.n}</span>
  <label>담당자<input type="text" id="b_${r.k}_0" value="${esc(b.r[r.k][0])}" placeholder="이름"></label>
  <label>대리자<input type="text" id="b_${r.k}_1" value="${esc(b.r[r.k][1])}" placeholder="담당자가 없을 때"></label></div>`).join('')}</div>
 <div class="row"><button class="btn sm line" id="fillDisc">팀 토론 내용 불러오기</button><button class="btn sm line" id="fillEx">예시로 채워 보기</button></div>
 <div class="preview"><canvas id="pv" width="1600" height="1000" aria-label="임무 배정표 미리보기"></canvas></div>
 <div class="row"><button class="btn y" id="save" ${ok?'':'disabled'}>배정표 이미지로 저장</button><span id="saveMsg" style="font-size:.86rem;color:var(--muted)"></span></div>
 </div>${nav()}`;},

end(){const b=S.board;
 return `<img class="hero" src="${IMG.board}" alt="">
 <div class="panel"><div class="eyebrow">마무리</div>
 <h2>위험은 함께 대비하고, <em>임무는 각자 확실하게</em></h2>
 <ul class="summary">${ROLES.map(r=>`<li class="${r.k}"><b>${r.n}</b>${esc(b.r[r.k][0]||'담당자 미정')}${b.r[r.k][1]?` · 대리 ${esc(b.r[r.k][1])}`:''}</li>`).join('')}</ul>
 <div class="note"><b>활동 후 할 일</b> ① 배정표를 작업장에 게시하고 팀원에게 공유하기 ② 대피 집결지와 소화기·AED 위치를 직접 걸어가 확인하기 ③ 담당자가 바뀌면 배정표 다시 만들기 ④ 분기마다 시나리오 훈련 다시 해 보기</div>
 </div>${nav()}`;}
};

/* ---- board canvas ---- */
function drawBoard(){const cv=document.getElementById('pv');if(!cv)return;const c=cv.getContext('2d'),W=1600,H=1000,b=S.board;
 const col={r1:'#d98a00',r2:'#1f9d5c',r3:'#d8392b',r4:'#2f6fd0'},soft={r1:'#fff1d6',r2:'#e2f6ea',r3:'#fde6e3',r4:'#e3edfb'};
 const F='"Noto Sans KR",sans-serif',J='"Jua","Noto Sans KR",sans-serif';
 c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
 c.fillStyle='#1b2f5c';c.fillRect(0,0,W,150);
 c.fillStyle='#f6c418';c.beginPath();c.arc(90,75,34,0,7);c.fill();c.fillStyle='#d8392b';c.beginPath();c.arc(90,80,20,Math.PI,0);c.fill();c.fillRect(66,80,48,10);
 c.fillStyle='#fff';c.font=`56px ${J}`;c.fillText('비상시 임무 배정표',150,95);
 c.font=`600 30px ${F}`;c.fillStyle='#f6c418';c.textAlign='right';c.fillText(b.site||'작업장 이름',W-60,72);
 c.fillStyle='#c9d3e8';c.font=`24px ${F}`;c.fillText('축산물품질평가원 서울지원',W-60,112);c.textAlign='left';
 const bw=(W-60*2-30)/2,bh=270;
 ROLES.forEach((r,i)=>{const x=60+(i%2)*(bw+30),y=180+Math.floor(i/2)*(bh+24);
  c.fillStyle=soft[r.k];round(c,x,y,bw,bh,22);c.fill();c.strokeStyle=col[r.k];c.lineWidth=5;round(c,x,y,bw,bh,22);c.stroke();
  c.fillStyle=col[r.k];c.font=`46px ${J}`;c.fillText(r.n,x+32,y+68);
  c.fillStyle='#5b6478';c.font=`24px ${F}`;c.fillText(r.s,x+32+c.measureText(r.n).width*0+0,y+104);
  c.fillStyle='#1b2233';c.font=`700 40px ${F}`;c.fillText(b.r[r.k][0]||'—',x+32,y+168);
  c.fillStyle='#5b6478';c.font=`26px ${F}`;c.fillText('대리자  '+(b.r[r.k][1]||'—'),x+32,y+212);
  c.font=`22px ${F}`;c.fillStyle=col[r.k];c.fillText(r.d.slice(0,2).join(' · '),x+32,y+250);
 });
 const fy=180+2*(bh+24)+4;c.fillStyle='#f1f3f7';round(c,60,fy,W-120,H-fy-36,18);c.fill();
 const info=[['대피 집결지',b.meet],['소화기',b.ext],['AED',b.aed],['비상연락처',b.tel]];
 const cw=(W-120)/4;info.forEach((it,i)=>{const x=60+i*cw+28;c.fillStyle='#5b6478';c.font=`700 22px ${F}`;c.fillText(it[0],x,fy+44);c.fillStyle='#1b2233';c.font=`600 26px ${F}`;wrap(c,it[1]||'—',x,fy+84,cw-40,32,2);});
 c.fillStyle='#d8392b';c.font=`700 24px ${F}`;c.textAlign='right';c.fillText('화재·구급 119',W-80,H-14);c.textAlign='left';
}
function round(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,t,x,y,w,lh,max){let line='',n=0;for(const ch of t){if(c.measureText(line+ch).width>w){c.fillText(line,x,y);y+=lh;line=ch;if(++n>=max-1){line=line;}}else line+=ch;}c.fillText(line,x,y);}
let dl=null;
async function saveBoard(){const m=document.getElementById('saveMsg');
 try{dl=dl||await window.claude?.use?.('downloads');}catch(e){dl=null;}
 if(!dl){const cv=document.getElementById('pv');cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`임무배정표_${(S.board.site||'작업장').replace(/[\\/:*?"<>|]/g,'')}.png`;document.body.appendChild(a);a.click();a.remove();m.textContent='저장했어요.';},'image/png');return;}
 const cv=document.getElementById('pv');cv.toBlob(async blob=>{try{await dl.save({filename:`임무배정표_${(S.board.site||'작업장').replace(/[\\/:*?"<>|]/g,'')}.png`,data:blob});m.textContent='저장했어요.';}
  catch(e){m.textContent=e&&e.code==='declined'?'저장을 취소했어요.':'저장하지 못했어요. 미리보기를 화면 캡처해 주세요.';}},'image/png');}

function render(){renderRail();const st=document.getElementById('stage');st.innerHTML=V[STEPS[S.cur].k]();
 const $=id=>document.getElementById(id);
 if($('prev'))$('prev').onclick=()=>go(S.cur-1);
 if($('next'))$('next').onclick=()=>{if(canLeave(S.cur))go(S.cur+1);};
 if($('restart'))$('restart').onclick=()=>{S=init();render();};
 st.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c;S.cards[i]=!S.cards[i];b.classList.toggle('on');b.setAttribute('aria-pressed',S.cards[i]);if(S.cards.every(Boolean))setTimeout(render,520);});
 st.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.sort.sel=S.sort.sel===+b.dataset.a?null:+b.dataset.a;render();});
 st.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const s=S.sort;if(s.sel===null)return;
  if(ACTS[s.sel][1]===b.dataset.b){s.placed[s.sel]=b.dataset.b;s.sel=null;render();}
  else{s.miss++;const ch=st.querySelector(`[data-a="${s.sel}"]`);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');if(ch){ch.classList.add('wrong');setTimeout(()=>ch.classList.remove('wrong'),600);}st.querySelector('.score').innerHTML=`<span>남은 카드 <b>${ORDER.filter(i=>s.placed[i]===undefined).length}</b></span><span>틀린 횟수 <b>${s.miss}</b></span>`;}});
 st.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.scen.role=b.dataset.r;render();});
 st.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const r=S.scen.role;S.scen.ans[r]=S.scen.ans[r]||{};S.scen.ans[r][+b.dataset.q]=+b.dataset.v;
  const beats=SCEN[r];if(beats.every((x,i)=>S.scen.ans[r][i]===x.a))S.scen.done[r]=true;render();});
 st.querySelectorAll('[data-d]').forEach(t=>t.oninput=()=>{S.disc[+t.dataset.d]=t.value;});
 if($('tstart'))$('tstart').onclick=()=>{if(timer)clearInterval(timer);let s=180;const tv=$('tv');timer=setInterval(()=>{s--;tv.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s<=0){clearInterval(timer);timer=null;tv.textContent='시간 끝!';}},1000);};
 if($('treset'))$('treset').onclick=()=>{if(timer)clearInterval(timer);timer=null;$('tv').textContent='3:00';};
 if(STEPS[S.cur].k==='board'){
  const bind=(id,set)=>{const el=$(id);if(el)el.oninput=()=>{set(el.value);drawBoard();refreshNext();$('save').disabled=!boardOK();renderRail();};};
  bind('b_site',v=>S.board.site=v);bind('b_meet',v=>S.board.meet=v);bind('b_ext',v=>S.board.ext=v);bind('b_aed',v=>S.board.aed=v);bind('b_tel',v=>S.board.tel=v);
  ROLES.forEach(r=>[0,1].forEach(j=>bind(`b_${r.k}_${j}`,v=>S.board.r[r.k][j]=v)));
  $('fillDisc').onclick=()=>{if(S.disc[0]&&!S.board.meet)S.board.meet=S.disc[0].split('\n')[0].slice(0,40);if(S.disc[1]&&!S.board.ext)S.board.ext=S.disc[1].split('\n')[0].slice(0,40);render();};
  $('fillEx').onclick=()=>{S.board={site:'예시) OO도축장',meet:'정문 앞 주차장',ext:'판정실 입구 왼쪽 벽',aed:'사무동 1층 로비',tel:'지원장 010-0000-0000',r:{r1:['김평가','이평가'],r2:['박평가','최평가'],r3:['정평가','김평가'],r4:['이평가','박평가']}};render();};
  $('save').onclick=saveBoard;
  (document.fonts?document.fonts.ready:Promise.resolve()).then(drawBoard);drawBoard();
 }
}
render();
</script>
