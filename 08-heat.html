<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: series stage format; summer palette from the image — sun orange, sky blue, deep navy */
:root{
  --bg:#fdf6ec; --surface:#ffffff; --fg:#1d2236; --muted:#5f6680; --sunk:#fbf3e6;
  --navy:#1b3470; --navy-ink:#ffffff; --sun:#f08a24; --sun-soft:#ffecd6; --sky:#2f86d6; --sky-soft:#e2f0fc;
  --yellow:#f6c418; --yellow-soft:#fff4c7; --hot:#e0452e; --hot-soft:#fde4df;
  --line:#ecdfcc; --good:#1f9d5c; --good-soft:#e2f6ea; --bad:#d8392b; --bad-soft:#fde6e3;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#221c16; --fg:#f3ece2; --muted:#b4a896; --sunk:#1c1712;
  --navy:#3f63b5; --navy-ink:#ffffff; --sun:#ff9f45; --sun-soft:#3b2814; --sky:#6db3f0; --sky-soft:#17293b;
  --yellow:#f6c418; --yellow-soft:#3a3214; --hot:#ff7a62; --hot-soft:#43211b;
  --line:#3a3026; --good:#4cc887; --good-soft:#163a29; --bad:#ff7466; --bad-soft:#41201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#221c16; --fg:#f3ece2; --muted:#b4a896; --sunk:#1c1712;
  --navy:#3f63b5; --navy-ink:#ffffff; --sun:#ff9f45; --sun-soft:#3b2814; --sky:#6db3f0; --sky-soft:#17293b;
  --yellow:#f6c418; --yellow-soft:#3a3214; --hot:#ff7a62; --hot-soft:#43211b;
  --line:#3a3026; --good:#4cc887; --good-soft:#163a29; --bad:#ff7466; --bad-soft:#41201d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;display:flex;align-items:center;gap:10px}
.brand .tag{background:var(--sun);color:#fff;font-size:.8rem;padding:3px 10px;border-radius:999px;font-family:var(--body);font-weight:700}
.org{font-size:.85rem;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rail button{all:unset;box-sizing:border-box;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:500}
.rail button[disabled]{cursor:not-allowed;opacity:.55}
.rail .bar{height:6px;border-radius:3px;background:var(--line)}
.rail button.done .bar{background:var(--navy)}
.rail button.cur .bar{background:var(--sun)}
.rail button.cur{color:var(--fg);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:4px}
@media (max-width:620px){.rail span.l{display:none}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.heroWrap{background:linear-gradient(180deg,#bfe0fb,#e8f4fe);display:flex;justify-content:center}
.hero{display:block;width:100%;max-width:440px;aspect-ratio:1/1;object-fit:cover}
.panel{padding:22px clamp(16px,4vw,32px) 26px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--sun)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.3;margin:0;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 2px}

p{margin:0;max-width:65ch}

.fb.good{background:var(--good-soft)} .fb.badf{background:var(--bad-soft)} .fb.info{background:var(--sky-soft)}

.qopts .opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox .opt{justify-content:center;font-family:var(--display);font-size:2.4rem;padding:14px;display:flex}
.cert{border:3px solid var(--sun);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px}

.cert .row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.9rem;color:var(--muted)}
input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--fg);width:100%;max-width:280px}
input[type=text]:focus{outline:none;border-color:var(--sky)}
nav.nav{display:flex;justify-content:space-between;gap:10px;padding:14px clamp(16px,4vw,32px);border-top:1px solid var(--line)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:11px 20px;border-radius:12px;font-weight:700;font-size:.95rem;display:inline-flex;align-items:center;gap:6px;justify-content:center}

.btn.pri{background:var(--navy);color:var(--navy-ink)}

.shake{animation:sh .35s}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* --- tiny sound effects (only after a click) --- */
let AC=null;
function beep(f,d,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sGulp=()=>{beep(520,.08);setTimeout(()=>beep(380,.1),90);};
const sGood=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110);};
const sBad=()=>beep(180,.3,'square',.07);

function canLeave(i){const k=STEPS[i].k;
 if(k==='meter')return BANDS.every(b=>S.meter.seen[b.id]);
 if(k==='game')return S.game.won||S.game.tries>=2;
 if(k==='sym')return SYM.every(c=>S.sym.done[c.id]);
 if(k==='aid')return S.aid.seq.length===4;
 if(k==='pledge')return S.pledge.every(Boolean);
 return true;}
let timer=null;
function stopGame(){if(timer){clearInterval(timer);timer=null;}if(S.game.st==='run'){S.game.st='ready';Object.assign(S.game,newGame(S.game.tries),{won:S.game.won});}}
function go(i){stopGame();S.cur=i;S.max=Math.max(S.max,i);render();document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'start'});}
function renderRail(){const r=document.getElementById('rail');
 r.innerHTML=STEPS.map((s,i)=>`<button role="tab" aria-selected="${i===S.cur}" class="${i===S.cur?'cur':(i<S.max?'done':'')}" ${i>S.max?'disabled':''} data-i="${i}"><span class="bar"></span><span class="l">${s.label}</span></button>`).join('');
 r.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));}
function nav(label){const ok=canLeave(S.cur),last=S.cur===STEPS.length-1;
 return `<nav class="nav"><button class="btn ghost" id="prev" ${S.cur===0?'disabled':''}>← 이전</button>${last?'<button class="btn ghost" id="restart">처음부터 다시</button>':`<button class="btn ${S.cur===0?'y':'pri'}" id="next" ${ok?'':'disabled'}>${label||'다음 →'}</button>`}</nav>`;}

const score=()=>S.quiz.ans.filter((x,k)=>x===QUIZ[k].a).length;

 ${g.rest?'<path d="M0 0h240v40q-60 30-120 0t-120 0z" fill="#5aa769"/><text x="18" y="270" font-size="13" font-weight="700" fill="#1b3470">그늘 휴식 중</text>':'<circle cx="214" cy="24" r="30" fill="#f6c418"/>'}
 ${g.rest?'<g transform="translate(184 196)"><circle r="26" fill="#dbe7f3" stroke="#7d93ad" stroke-width="3"/><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".6s" repeatCount="indefinite"/><ellipse rx="6" ry="20" fill="#7d93ad"/><ellipse rx="20" ry="6" fill="#7d93ad"/></g><rect x="-4" y="26" width="8" height="30" fill="#7d93ad"/></g>':''}
 ${fall?'<g transform="rotate(-80 120 200)">':'<g>'}
 <rect x="76" y="160" width="88" height="96" rx="26" fill="#fff" stroke="#c9d3e2" stroke-width="3"/>
 ${g.ice>0?'<rect x="80" y="166" width="80" height="54" rx="14" fill="#8fd0ff" opacity=".85"/><text x="120" y="200" text-anchor="middle" font-size="16">🧊</text>':''}
 <rect x="84" y="244" width="30" height="26" rx="10" fill="#2f6fe0"/><rect x="126" y="244" width="30" height="26" rx="10" fill="#2f6fe0"/>
 <circle cx="120" cy="104" r="50" fill="#f9dcc6"/>
 <circle cx="88" cy="118" r="9" fill="#f6a9a0" opacity=".7"/><circle cx="152" cy="118" r="9" fill="#f6a9a0" opacity=".7"/>
 <path d="M66 92a54 50 0 0 1 108 0z" fill="#fff" stroke="#c9d3e2" stroke-width="3"/><rect x="62" y="86" width="116" height="12" rx="6" fill="#fff" stroke="#c9d3e2" stroke-width="3"/>
 <path d="M112 66q8-14 16 0" stroke="#1b3470" stroke-width="4" fill="none"/><path d="M118 66q8-14 16 0" stroke="#e0452e" stroke-width="4" fill="none"/>
 ${face}${sweat}

end(){const sc=score(),pass=sc>=4,d=new Date(),ds=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
 return `<div class="panel"><div class="eyebrow">교육 완료</div>
 <div class="cert"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div style="font-weight:700">온열질환 예방교육</div><div style="color:var(--muted);font-size:.9rem">퀴즈 점수</div></div><div class="score">${sc} / ${QUIZ.length}</div></div>
 <div class="fb ${pass?'good':'badf'}">${pass?'이수 기준(4문제 이상)을 통과했어요. 오늘도 물 한 컵, 그늘 한 번, 꼭 챙겨요.':'이수 기준은 4문제 이상이에요. 아래 버튼으로 퀴즈를 다시 풀어 보세요.'}</div>
 <label for="nm" style="font-weight:700;font-size:.9rem">교육 이수자 이름</label>
 <input type="text" id="nm" placeholder="이름 입력" value="${S.name.replace(/"/g,'&quot;')}">
 <div class="row"><span>교육일 ${ds}</span><span id="nmv">${S.name?'이수자 '+S.name:''}</span><span>축산물품질평가원 서울지원</span></div></div>
 <ul class="summary"><li><b>물</b>갈증 없어도 20분마다 한 컵</li><li><b>휴식</b>33℃ 이상 2시간마다 20분</li><li><b>열사병</b>뜨겁고 건조한 피부 → 119</li><li><b>응급</b>의식 없으면 물 먹이지 않기</li></ul>
 ${pass?'':'<div><button class="btn s" id="retry">퀴즈 다시 풀기</button></div>'}
 </div>${nav()}`;}
};

/* ---------- game engine ---------- */
function gClock(p){const m=10*60+Math.round(p/100*480);const h=Math.floor(m/60),mm=m%60;return `${h<12?'오전':'오후'} ${h>12?h-12:h}:${String(mm).padStart(2,'0')}`;}
const isNoon=p=>{const m=10*60+p/100*480;return m>=14*60&&m<17*60;};
function gUpdate(){const g=S.game,$=id=>document.getElementById(id);if(!$('tv'))return;
 const tp=Math.max(0,Math.min(100,(g.T-36)/(GT.fail-36)*100));
 $('tv').textContent=g.T.toFixed(1)+'℃';$('tb').style.width=tp+'%';$('tb').style.background=g.T>=GT.warn?'#e0452e':g.T>=37.4?'#f08a24':'#1f9d5c';
 $('hv').textContent=Math.round(g.hyd)+'%';$('hb').style.width=g.hyd+'%';$('hb').style.background=g.hyd<25?'#e0452e':'#2f86d6';
 $('pv').textContent=Math.floor(g.prog)+'%';$('pb').style.width=g.prog+'%';$('pb').style.background='#1b3470';
 $('clk').textContent=g.st==='win'?'오후 6:00 퇴근!':gClock(g.prog);$('noon').hidden=!(g.st==='run'&&isNoon(g.prog));
 const run=g.st==='run';
 $('aW').disabled=!run||g.cd>0;$('cdb').style.width=(g.cd/GT.cd*100)+'%';
 $('aR').disabled=!run;$('aR').classList.toggle('on',g.rest);$('rl').textContent=g.rest?'일하러 가기':'그늘 휴식';$('rs').textContent=g.rest?'휴식 끝내기':'체온 내리기';
 $('aI').disabled=!run||g.iceUsed;$('is').textContent=g.ice>0?`효과 ${Math.ceil(g.ice)}초`:(g.iceUsed?'다 썼어요':'1번 사용');
 const t=$('toast');t.textContent=g.msg;t.className='toast '+(g.mt||'');
 $('fig').innerHTML=kidSVG();
 $('gs').hidden=run;$('gs').textContent=g.tries?'다시 도전 ↻':'근무 시작 ▶';
 const r=$('res');
 if(g.st==='win')r.innerHTML=`<div class="result win"><span class="big2">🎉 퇴근 성공!</span><span>물 ${g.drinks}번, 그늘 휴식 ${Math.round(g.restS*5)}분(게임 시간)으로 축평이를 지켰어요. 물만으로는 부족하고, 쉬어야 체온이 내려가요!</span></div>`;
 else if(g.st==='lose')r.innerHTML=`<div class="result lose"><span class="big2">😵 축평이가 쓰러졌어요</span><span>${g.lose}</span>${g.tries>=2?'<span><b>두 번 도전했으니 다음 단계로 넘어가도 돼요.</b> 한 번 더 해 봐도 좋아요!</span>':''}</div>`;
 else r.innerHTML='';
 const nx=$('next');if(nx)nx.disabled=!canLeave(S.cur);
 const tk=document.querySelector('.task');if(tk&&canLeave(S.cur)){tk.className='task ok';tk.textContent=g.won?'성공! 다음 단계로 넘어갈 수 있어요':'두 번 도전했어요. 다음 단계로 넘어갈 수 있어요';}
}
function say(m,t){S.game.msg=m;S.game.mt=t||'';}
function gTick(){const g=S.game,dt=.1;if(g.st!=='run')return;
 const hf=isNoon(g.prog)?GT.noon:1;
 if(g.rest){g.T-=GT.rest*dt;g.hyd-=GT.hydR*dt;g.restS+=dt;}
 else{g.T+=(GT.rise*hf*(g.ice>0?.45:1)+(g.hyd<25?GT.dry:0))*dt;g.hyd-=GT.hydW*hf*dt;g.prog+=GT.work*dt;}
 g.T=Math.max(36.5,g.T);g.hyd=Math.max(0,Math.min(100,g.hyd));if(g.ice>0)g.ice=Math.max(0,g.ice-dt);if(g.cd>0)g.cd=Math.max(0,g.cd-dt);
 if(g.T>=GT.fail){g.st='lose';g.tries++;clearInterval(timer);timer=null;sBad();
  g.lose=g.hyd<25?'물을 너무 오래 안 마셨어요. 수분이 부족하면 체온이 훨씬 빨리 올라요.':(g.restS<3?'쉬지 않고 계속 일했어요. 더위 속에서는 일을 멈추고 그늘에서 쉬어야 체온이 내려가요.':'무더위 시간대에 체온이 너무 올랐어요. 오후 2~5시엔 더 자주 쉬어야 해요.');
  say('열사병 위험! 실제라면 바로 119에 신고해야 해요.','warn');gUpdate();return;}
 if(g.prog>=100){g.prog=100;g.st='win';g.won=true;clearInterval(timer);timer=null;sGood();say('오늘도 건강하게 퇴근해요!','ok');gUpdate();return;}
 if(g.rest&&g.T<=36.8)say('체온이 내려갔어요. 이제 다시 일하러 가도 돼요!','ok');
 else if(g.T>=39)say('🚨 머리가 아프고 어지러워요… 지금 당장 쉬어야 해요!','warn');
 else if(g.T>=GT.warn)say('🥵 땀이 비 오듯 나요. 그늘에서 쉬어요!','warn');
 else if(g.hyd<25)say('💧 입이 바싹 말라요. 물을 마셔요!','warn');
 else if(!g.rest&&isNoon(g.prog))say('🔥 오후 2~5시 무더위 시간! 체온이 더 빨리 올라요.','warn');
 else if(g.rest)say('🌳 그늘에서 쉬는 중이에요. 체온이 내려가요.','ok');
 else say('열심히 일하는 중… 체온과 수분을 잘 지켜봐요.','');
 gUpdate();}
function gStart(){stopGame();S.game=Object.assign(newGame(S.game.tries),{won:S.game.won,st:'run'});say('근무 시작! 화이팅!','');beep(600,.1);gUpdate();timer=setInterval(gTick,100);}

function render(){renderRail();const st=document.getElementById('stage');st.innerHTML=V[STEPS[S.cur].k]();
 const $=id=>document.getElementById(id);
 if($('prev'))$('prev').onclick=()=>go(S.cur-1);
 if($('next'))$('next').onclick=()=>{if(canLeave(S.cur))go(S.cur+1);};
 if($('restart'))$('restart').onclick=()=>{stopGame();S=init();render();};
 const rng=$('rng');if(rng)rng.oninput=()=>{S.meter.v=+rng.value;S.meter.seen[bandOf(S.meter.v).id]=true;const y=window.scrollY;render();window.scrollTo(0,y);const r2=$('rng');r2.focus();};
 if(STEPS[S.cur].k==='game'){gUpdate();
  $('gs').onclick=gStart;
  $('aW').onclick=()=>{const g=S.game;if(g.st!=='run'||g.cd>0)return;g.hyd=Math.min(100,g.hyd+GT.drink);g.T=Math.max(36.5,g.T-GT.water);g.cd=GT.cd;g.drinks++;sGulp();say('💧 꿀꺽꿀꺽! 수분 보충 완료.','ok');gUpdate();};
  $('aR').onclick=()=>{const g=S.game;if(g.st!=='run')return;g.rest=!g.rest;beep(g.rest?440:620,.1);gUpdate();};
  $('aI').onclick=()=>{const g=S.game;if(g.st!=='run'||g.iceUsed)return;g.iceUsed=true;g.ice=GT.ice;beep(900,.15,'triangle');say('🧊 냉조끼 착용! 잠시 체온이 천천히 올라요.','ok');gUpdate();};}
 st.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.sym.sel=b.dataset.s;render();});
 st.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const c=S.sym;if(!c.sel){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return;}
  if(c.sel===b.dataset.n){c.done[c.sel]=true;c.sel=null;sGood();render();}else{sBad();b.classList.add('wrong');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');setTimeout(()=>b.classList.remove('wrong'),600);}});
 st.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const a=S.aid,c=AIDC.find(x=>x.id===b.dataset.c);if(a.seq.length>=4)return;
  if(c.ok===undefined){a.trap=c.id;a.bad=null;sBad();render();return;}
  if(c.ok===a.seq.length){a.seq.push(c.id);a.trap=null;a.bad=null;sGood();render();}
  else{a.trap=null;a.bad=`그것도 해야 할 일이 맞아요! 그런데 ${a.seq.length+1}번째로 먼저 할 일이 있어요. ${a.seq.length===0?'가장 먼저 무엇을 해야 도움이 빨리 올까요?':''}`;sBad();render();const bb=document.querySelector(`[data-c="${c.id}"]`);if(bb){bb.classList.add('shake');}}});
 st.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pl;S.pledge[i]=!S.pledge[i];render();});
 st.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=S.quiz.i;if(S.quiz.ans[i]!==undefined)return;S.quiz.ans[i]=+b.dataset.a;(S.quiz.ans[i]===QUIZ[i].a?sGood:sBad)();render();});
 if($('qn'))$('qn').onclick=()=>{S.quiz.i++;render();};
 if($('retry'))$('retry').onclick=()=>{S.quiz={i:0,ans:[]};render();};
 const nm=$('nm');if(nm)nm.oninput=()=>{S.name=nm.value.trim();$('nmv').textContent=S.name?'이수자 '+S.name:'';};
}
render();
</script>
