<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: series stage format; lab palette from the image — clean lab blue, cabinet yellow, GHS red */
:root{
  --bg:#eef4fb; --surface:#ffffff; --fg:#152238; --muted:#566582; --sunk:#f4f8fd;
  --navy:#1b3470; --navy-ink:#ffffff; --lab:#2f7be0; --lab-soft:#e2eefc; --yellow:#f6c418; --yellow-soft:#fff4c7;
  --ghs:#d4202a; --ghs-soft:#fde4e4; --line:#d6e2ef; --good:#1f9d5c; --good-soft:#e2f6ea; --bad:#d8392b; --bad-soft:#fde6e3;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --surface:#18212f; --fg:#e8eef7; --muted:#9fb0c8; --sunk:#141c28;
  --navy:#3f63b5; --navy-ink:#ffffff; --lab:#74adf2; --lab-soft:#1a2c42; --yellow:#f6c418; --yellow-soft:#3a3214;
  --ghs:#ff5a60; --ghs-soft:#43202a; --line:#2b3a50; --good:#4cc887; --good-soft:#163a29; --bad:#ff7466; --bad-soft:#41201d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --surface:#18212f; --fg:#e8eef7; --muted:#9fb0c8; --sunk:#141c28;
  --navy:#3f63b5; --navy-ink:#ffffff; --lab:#74adf2; --lab-soft:#1a2c42; --yellow:#f6c418; --yellow-soft:#3a3214;
  --ghs:#ff5a60; --ghs-soft:#43202a; --line:#2b3a50; --good:#4cc887; --good-soft:#163a29; --bad:#ff7466; --bad-soft:#41201d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;display:flex;align-items:center;gap:10px}
.brand .tag{background:var(--lab);color:#fff;font-size:.8rem;padding:3px 10px;border-radius:999px;font-family:var(--body);font-weight:700}
.org{font-size:.85rem;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rail button{all:unset;box-sizing:border-box;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:500}
.rail button[disabled]{cursor:not-allowed;opacity:.55}
.rail .bar{height:6px;border-radius:3px;background:var(--line)}
.rail button.done .bar{background:var(--navy)}
.rail button.cur .bar{background:var(--yellow)}
.rail button.cur{color:var(--fg);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--lab);outline-offset:3px;border-radius:4px}
@media (max-width:620px){.rail span.l{display:none}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hero{display:block;width:100%;aspect-ratio:1672/941;object-fit:cover;max-width:100%;background:var(--lab-soft)}
.panel{padding:22px clamp(16px,4vw,32px) 26px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--lab)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.3;margin:0;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 2px}
h3{margin:0;font-size:1rem}
p{margin:0;max-width:65ch}
.lead{color:var(--muted)}
.task{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;background:var(--yellow-soft);border-radius:10px;padding:8px 12px;width:fit-content;max-width:100%}
.task::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none}
.task.ok{background:var(--good-soft)} .task.ok::before{background:var(--good)}
.note{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
.note b{color:var(--fg)}
.fb{font-size:.9rem;padding:10px 12px;border-radius:10px;line-height:1.55}
.fb.good{background:var(--good-soft)} .fb.badf{background:var(--bad-soft)} .fb.info{background:var(--lab-soft)}
.summary{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0;padding:0;list-style:none}
.summary li{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.summary li b{display:block;color:var(--lab);font-size:.78rem}
.cnt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
/* pictogram game */
.pg{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:600px){.pg{grid-template-columns:1fr}}
.flip{width:100%;max-width:200px;aspect-ratio:1/1;margin:0 auto;perspective:800px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;border-radius:20px}
.flip .f{background:var(--sunk);border:2px solid var(--line)}
.flip .b{transform:rotateY(180deg);background:var(--good-soft);border:2px solid var(--good);padding:14px;text-align:center;flex-direction:column;gap:4px}
.flip .b .nm{font-family:var(--display);font-size:1.5rem;color:var(--fg)}
.flip .b small{font-size:.82rem;color:var(--muted);line-height:1.45}
.gh{width:82%;height:auto;display:block}
.qopts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border-radius:10px;border:2px solid var(--line);font-weight:500;background:var(--surface);font-size:.92rem;line-height:1.5}
.opt:hover{border-color:var(--lab)}
.opt:focus-visible{outline:3px solid var(--lab);outline-offset:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.qopts .opt{display:flex;gap:10px;align-items:flex-start}
.qopts .opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.dex{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:480px){.dex{grid-template-columns:repeat(3,1fr)}}
.dx{border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);text-align:center}
.dx .gh{width:70%}
.dx.on{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--fg);font-weight:700}
.dx:not(.on) .gh{opacity:.25;filter:grayscale(1)}
/* label */
.lbl{border:3px solid var(--ghs);border-radius:14px;background:#fff;color:#1a1a1a;padding:12px;display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:620px}
.lbl .z{all:unset;box-sizing:border-box;cursor:pointer;border:2px dashed #b9c4d3;border-radius:10px;padding:8px 10px;font-size:.84rem;line-height:1.45;position:relative;background:#fff;color:#1a1a1a}
.lbl .z:hover{border-color:var(--lab)}

let AC=null;
function beep(f,d,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sGood=()=>{beep(660,.12);setTimeout(()=>beep(880,.18),110);};
const sBad=()=>beep(180,.3,'square',.07);
const sBoom=()=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*.4,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=.25;s.buffer=buf;s.connect(g).connect(AC.destination);s.start();}catch(e){}};

function canLeave(i){const k=STEPS[i].k;

const task=(t,ok)=>`<div class="task ${ok?'ok':''}">${ok?'완료! 다음으로 넘어가요':t}</div>`;
const score=()=>S.quiz.ans.filter((x,k)=>x===QUIZ[k].a).length;
const SLOGAN=`<div class="slogan"><span><b>📖 읽고</b>통에 붙은 그림 보기</span><span><b>🧤 끼고</b>장갑·보안경</span><span><b>💨 환기하고</b>환풍기·창문</span><span><b>🚫 안 섞고</b>세제끼리 섞지 않기</span></div>`;

const V={
intro(){return `<img class="hero" src="img/c0.jpg" alt="보안경을 쓴 축평이가 MSDS 파일을 들고 화학물질 보관함 앞에 서 있어요">
 <div class="panel"><div class="eyebrow">1월 안전보건교육 · MSDS · 약 5분</div>
 <h2>MSDS는 <em>화학물질 사용설명서</em>예요</h2>
 <p class="lead">락스, 알코올 소독제처럼 우리가 매일 쓰는 것도 화학물질이에요. 어렵게 외울 필요 없어요. 딱 이 네 가지만 기억해요!</p>
 ${SLOGAN}
 <div class="note"><b>MSDS 파일은 어디?</b> 사무실과 작업장에 비치돼 있어요. 위치만 알아 두면 돼요.</div>
 </div>${nav('시작하기 →')}`;},

before(){const ok=canLeave(1);
 return `<div class="hot"><img src="img/m1.jpg" alt="축평이가 보안경과 장갑을 끼고 환기 후드 앞에서 MSDS를 보고 있어요">${BEF.map(b=>`<button class="hs ${S.bef[b.id]?'on':''}" style="left:${b.x}%;top:${b.y}%" data-bf="${b.id}" aria-label="${b.n}"></button>`).join('')}</div>
 <div class="panel"><div class="eyebrow">1. 쓰기 전에</div>
 <h2>축평이처럼 <em>세 가지</em> 먼저!</h2>
 <p class="lead">그림 속 반짝이는 동그라미 3개를 눌러 보세요.</p>
 ${task('동그라미 3개를 모두 눌러 보세요',ok)}
 <div class="bef">${BEF.map(b=>`<div class="bf ${S.bef[b.id]?'on':''}">${S.bef[b.id]?`<b>${b.em} ${b.n}</b>${b.d}`:'<b>?</b>그림에서 찾아보세요'}</div>`).join('')}</div>
 </div>${nav()}`;},

pic(){const ok=canLeave(2);
 return `<div class="panel"><div class="eyebrow">2. 그림 3개만 알아요</div>
 <h2>빨간 마름모 = <em>조심하세요!</em></h2>
 <p class="lead">통에 빨간 마름모 그림이 있으면 조심해야 하는 물건이에요. 카드를 눌러 뜻을 확인해요.</p>
 ${task('카드 3장을 모두 눌러 보세요',ok)}
 <div class="flips">${PICS.map(p=>`<button class="flip ${S.pic[p.k]?'on':''}" data-p="${p.k}" aria-pressed="${!!S.pic[p.k]}" aria-label="${S.pic[p.k]?p.n:'그림 카드'}"><span class="in"><span class="f">${gh(p.k)}<small>눌러 보세요</small></span><span class="b"><span class="nm">${p.n}</span><small>${p.d}</small><small>예: ${p.ex}</small></span></span></button>`).join('')}</div>
 ${ok?'<div class="fb good"><b>끝!</b> 다른 그림도 있지만, 빨간 마름모가 보이면 일단 "조심!"이라고 기억하면 돼요.</div>':''}
 </div>${nav()}`;},

items(){const ok=canLeave(3);
 return `<div class="panel"><div class="eyebrow">3. 우리가 쓰는 것</div>
 <h2>우리는 <em>이 두 가지</em>만 조심해요</h2>
 <p class="lead">카드를 눌러 어떻게 쓰면 되는지 확인해요.</p>
 ${task('카드 2장을 모두 눌러 보세요',ok)}
 <div class="its">${ITEMS.map(x=>{const on=S.items[x.id];return `<button class="itc ${on?'on':''}" data-it="${x.id}"><span class="top"><span class="em">${x.em}</span><span class="nm">${x.n}</span><span class="pics">${x.pics.map(gh).join('')}</span></span>
  ${on?`<span class="bad">⚠️ ${x.bad}</span><span class="how">${x.how.map(h=>`<span>✅ ${h}</span>`).join('')}</span>`:'<span class="tap">눌러서 확인 👆</span>'}</button>`;}).join('')}</div>
 <div class="note"><b>냉장실에서 지독한 냄새가 나면?</b> 냉동설비 가스(암모니아)가 새는 거예요. 만지지 말고 바로 밖으로 나가서 알려요.</div>
 </div>${nav()}`;},

mix(){const M=S.mix,ok=canLeave(4),fin=M.i>=MIX.length;const H='<img class="hero" src="img/m3.jpg" alt="락스와 세제를 섞으면 독가스가 나와요. 축평이가 전화하며 비상구로 대피해요">';
 if(fin)return H+`<div class="panel"><div class="eyebrow">4. 섞지 마!</div>
 <h2>${M.score} / ${MIX.length} <em>맞혔어요!</em></h2>
 <div class="fb good"><b>기억해요.</b> 세제끼리 섞지 않고, 다른 통에 옮겨 담지 않아요. 만약 섞여서 매운 냄새가 나면? 그림 속 축평이처럼 <b>바로 밖으로 나가서 알려요!</b></div>
 <div><button class="btn l" id="mr">한 번 더 하기 ↻</button></div>
 </div>${nav()}`;
 const m=MIX[M.i],done=M.ans!==null;
 return H+`<div class="panel"><div class="eyebrow">4. 섞지 마!</div>
 <h2>이렇게 하면 <em>괜찮을까요?</em></h2>
 <div class="qhead"><span>${M.i+1} / ${MIX.length}</span><span>맞힌 개수 ${M.score}</span></div>
 <div class="mix"><div class="chem"><span class="em">${m.a[0]}</span>${m.a[1]}</div><span class="plus">+</span><div class="chem"><span class="em">${m.b[0]}</span>${m.b[1]}</div></div>
 ${done?`<div class="boom ${m.ok?'ok':'bad'}"><div><span class="em">${m.ok?'✅':'💥'}</span>${m.r}</div></div>
  <div class="fb ${M.ans===m.ok?'good':'badf'}"><b>${M.ans===m.ok?'정답!':'앗, 틀렸어요.'}</b> ${m.e}</div>
  <div><button class="btn l" id="mn">${M.i<MIX.length-1?'다음 →':'결과 보기 →'}</button></div>`
 :`<div class="two"><button class="opt" data-m="1"><span class="em">⭕</span>괜찮아요</button><button class="opt" data-m="0"><span class="em">❌</span>위험해요</button></div>`}
 </div>${nav()}`;},

aid(){const ok=canLeave(5),g=SCN[1],eok=EYE.filter(e=>e.ok).every(e=>S.eye[e.id]);
 return `<img class="hero" src="img/m2.jpg" alt="축평이가 눈 세척기에서 흐르는 물로 눈을 씻고 있어요. 15분, 비비지 않기, 병원">
 <div class="panel"><div class="eyebrow">5. 눈에 튀면?</div>
 <h2>락스가 눈에 튀었어요! <em>맞는 행동</em> 4개를 골라요</h2>
 ${task('맞는 행동 4개를 찾고, 아래 문제도 풀어 보세요',ok)}
 <div class="cnt">찾은 행동 ${EYE.filter(e=>S.eye[e.id]).length} / 4</div>
 <div class="eyes">${EYE.map(e=>`<button class="ey ${S.eye[e.id]?'ok':''} ${S.eyeNo===e.id?'no':''}" data-ey="${e.id}" ${S.eye[e.id]?'disabled':''}><span class="em">${e.em}</span>${e.t}</button>`).join('')}</div>
 ${S.eyeNo?`<div class="fb badf"><b>안 돼요!</b> ${EYE.find(e=>e.id===S.eyeNo).why}</div>`:''}
 ${eok?'<div class="fb good"><b>정답!</b> 흐르는 물로 15분 이상, 비비지 말고, 병원 갈 땐 제품 통이나 MSDS 사진을 챙겨요. 눈 세척기 위치도 미리 알아 둬요.</div>':''}
 <div class="scn ${S.gas===g.a?'done':''}"><div class="t">${g.t}</div><div class="two">${g.o.map((o,k)=>{let c='';if(S.gas!==null){if(k===g.a&&S.gas===g.a)c='right';else if(k===S.gas)c='wrong';}return `<button class="opt sm ${c}" data-gas="${k}" ${S.gas===g.a?'disabled':''}>${o}</button>`;}).join('')}</div>${S.gas!==null?`<div class="fb ${S.gas===g.a?'good':'badf'}">${S.gas===g.a?'<b>정답!</b> '+g.e:'다시 골라 보세요.'}</div>`:''}</div>
 </div>${nav('퀴즈 풀기 →')}`;},

quiz(){const Q=S.quiz;if(Q.i>=QUIZ.length)return V.end();
 const i=Q.i,q=QUIZ[i],a=Q.ans[i],done=a!==undefined;
 const opt=(j,inner)=>{let c='';if(done){if(j===q.a)c='right';else if(j===a)c='wrong';}return `<button class="opt ${c}" data-a="${j}" ${done?'disabled':''}>${inner}</button>`;};
 return `<div class="panel"><div class="eyebrow">확인 퀴즈</div>
 <div class="qhead"><span>문제 ${i+1} / ${QUIZ.length}</span><span>맞힌 문제 ${score()}</span></div>
 <div class="qbar"><i style="width:${Q.ans.length/QUIZ.length*100}%"></i></div>
 <h2 style="font-size:clamp(1.3rem,3.4vw,1.7rem)">${q.q}</h2>
 ${q.t==='ox'?`<div class="ox">${opt(0,'O')}${opt(1,'X')}</div>`:`<div class="qopts">${q.o.map((o,j)=>opt(j,`<span class="l">${j+1}</span><span>${o}</span>`)).join('')}</div>`}
 ${done?`<div class="fb ${a===q.a?'good':'badf'}"><b>${a===q.a?'정답이에요.':'아쉬워요. 정답은 '+(q.t==='ox'?(q.a?'X':'O'):(q.a+1)+'번')+'이에요.'}</b> ${q.e}</div><div><button class="btn pri" id="qn">${i<QUIZ.length-1?'다음 문제 →':'결과 보기 →'}</button></div>`:''}
 </div>${nav()}`;},

end(){const sc=score(),pass=sc>=3,d=new Date(),ds=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
 return `<div class="panel"><div class="eyebrow">교육 완료</div>
 <div class="cert"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div style="font-weight:700">MSDS 화학물질 안전교육</div><div style="color:var(--muted);font-size:.9rem">퀴즈 점수</div></div><div class="score">${sc} / ${QUIZ.length}</div></div>
 <div class="fb ${pass?'good':'badf'}">${pass?'이수 완료! 오늘부터 읽고·끼고·환기하고·안 섞고!':'3문제 이상 맞히면 이수예요. 아래 버튼으로 다시 풀어 보세요.'}</div>
 <label for="nm" style="font-weight:700;font-size:.9rem">교육 이수자 이름</label>
 <input type="text" id="nm" placeholder="이름 입력" value="${S.name.replace(/"/g,'&quot;')}">
 <div class="row"><span>교육일 ${ds}</span><span id="nmv">${S.name?'이수자 '+S.name:''}</span><span>축산물품질평가원 서울지원</span></div></div>
 ${SLOGAN}
 ${pass?'':'<div><button class="btn l" id="retry">퀴즈 다시 풀기</button></div>'}
 </div>${nav()}`;}
};

function render(){renderRail();const st=document.getElementById('stage');st.innerHTML=V[STEPS[S.cur].k]();
 const $=id=>document.getElementById(id);
 if($('prev'))$('prev').onclick=()=>go(S.cur-1);
 if($('next'))$('next').onclick=()=>{if(canLeave(S.cur))go(S.cur+1);};
 if($('restart'))$('restart').onclick=()=>{S=init();render();};
 st.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p;if(!S.pic[k])sGood();S.pic[k]=!S.pic[k]||true;render();});
 st.querySelectorAll('[data-bf]').forEach(b=>b.onclick=()=>{if(!S.bef[b.dataset.bf])sGood();S.bef[b.dataset.bf]=true;render();});
 st.querySelectorAll('[data-ey]').forEach(b=>b.onclick=()=>{const e=EYE.find(x=>x.id===b.dataset.ey);if(e.ok){S.eye[e.id]=true;S.eyeNo=null;sGood();}else{S.eyeNo=e.id;sBad();}render();});
 st.querySelectorAll('[data-gas]').forEach(b=>b.onclick=()=>{S.gas=+b.dataset.gas;(S.gas===SCN[1].a?sGood:sBad)();render();});
 st.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{if(!S.items[b.dataset.it])sGood();S.items[b.dataset.it]=true;render();});
 st.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const M=S.mix,m=MIX[M.i];M.ans=+b.dataset.m;if(M.ans===m.ok)M.score++;m.ok?sGood():sBoom();render();});
 if($('mn'))$('mn').onclick=()=>{S.mix.i++;S.mix.ans=null;render();};
 if($('mr'))$('mr').onclick=()=>{S.mix={i:0,ans:null,score:0};render();};
 st.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{const j=+b.dataset.sc,k=+b.dataset.k;S.aid[j]=k;(k===SCN[j].a?sGood:sBad)();render();});
 st.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=S.quiz.i;if(S.quiz.ans[i]!==undefined)return;S.quiz.ans[i]=+b.dataset.a;(S.quiz.ans[i]===QUIZ[i].a?sGood:sBad)();render();});
 if($('qn'))$('qn').onclick=()=>{S.quiz.i++;render();};
 if($('retry'))$('retry').onclick=()=>{S.quiz={i:0,ans:[]};render();};
 const nm=$('nm');if(nm)nm.oninput=()=>{S.name=nm.value.trim();$('nmv').textContent=S.name?'이수자 '+S.name:'';};
}
render();
</script>

</body>
</html>
