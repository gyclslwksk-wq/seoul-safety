<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: lesson stage with stepper rail (same series as the other safety lessons); calmer palette — temple-wood amber + pine teal */
:root{
  --bg:#f4f1ec; --surface:#ffffff; --fg:#22242a; --muted:#646a73; --sunk:#f8f6f2;
  --teal:#2e7d74; --teal-ink:#ffffff; --teal-soft:#dff0ec; --amber:#e9a23b; --amber-soft:#fcefd9;
  --navy:#2b3a55; --navy-ink:#ffffff; --blue:#3d7fd0; --line:#e3ddd3;
  --good:#2e9461; --good-soft:#e1f4e9; --bad:#cc4b3c; --bad-soft:#fbe5e1;
  --display:"Jua","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171b; --surface:#1e2228; --fg:#ece9e4; --muted:#a3a8b0; --sunk:#181b20;
  --teal:#5bbcaf; --teal-ink:#0f2421; --teal-soft:#183530; --amber:#f2b55c; --amber-soft:#3a2d17;
  --navy:#4a6390; --navy-ink:#ffffff; --blue:#78aaf0; --line:#323840;
  --good:#5cc98e; --good-soft:#173528; --bad:#ff8475; --bad-soft:#41221e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1e2228; --fg:#ece9e4; --muted:#a3a8b0; --sunk:#181b20;
  --teal:#5bbcaf; --teal-ink:#0f2421; --teal-soft:#183530; --amber:#f2b55c; --amber-soft:#3a2d17;
  --navy:#4a6390; --navy-ink:#ffffff; --blue:#78aaf0; --line:#323840;
  --good:#5cc98e; --good-soft:#173528; --bad:#ff8475; --bad-soft:#41221e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.35rem;display:flex;align-items:center;gap:10px}
.brand .tag{background:var(--teal);color:var(--teal-ink);font-size:.8rem;padding:3px 10px;border-radius:999px;font-family:var(--body);font-weight:700}
.org{font-size:.85rem;color:var(--muted)}
.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:500}
.rail button[disabled]{cursor:not-allowed;opacity:.55}
.rail .bar{height:6px;border-radius:3px;background:var(--line)}
.rail button.done .bar{background:var(--teal)}
.rail button.cur .bar{background:var(--amber)}
.rail button.cur{color:var(--fg);font-weight:700}
.rail button:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
@media (max-width:640px){.rail span.l{display:none}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.hero{display:block;width:100%;aspect-ratio:1672/941;object-fit:cover;max-width:100%;background:var(--line)}
.panel{padding:22px clamp(16px,4vw,32px) 26px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--teal)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,3.6vw,1.9rem);line-height:1.3;margin:0;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 58%,var(--amber-soft) 58%);padding:0 2px}
p{margin:0;max-width:65ch}
.lead{color:var(--muted)}
.task{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem;background:var(--amber-soft);border-radius:10px;padding:8px 12px;width:fit-content;max-width:100%}
.task::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.task.ok{background:var(--good-soft)} .task.ok::before{background:var(--good)}
.note{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.88rem;color:var(--muted)}
.note b{color:var(--fg)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rv{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-width:0}
.rv:hover{border-color:var(--teal)}
.rv:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.rv .t{font-family:var(--display);font-size:1.15rem;line-height:1.35}
.rv .body{font-size:.9rem;line-height:1.6}
.rv .more{font-size:.8rem;color:var(--teal);font-weight:700}
.rv.on{border-color:var(--teal);background:var(--teal-soft)}

 return `<div class="panel"><div class="eyebrow">1. 직무스트레스</div>
 <h2>일에서 오는 스트레스, <em>개인 탓이 아니에요</em></h2>
 <p class="lead">직무스트레스는 업무 환경, 근로시간, 사람을 대하는 일 등 일 자체에서 생기는 부담이에요. 그래서 법도 사업주가 직무스트레스 요인을 평가하고, 근로시간 조정·휴식 배분 같은 예방 조치를 하도록 정하고 있어요(산업안전보건기준에 관한 규칙 제669조).</p>
 ${task('평가사 업무의 스트레스 요인 다섯 가지를 눌러 보세요',ok)}
 <div class="cards">${KNOW.map((c,i)=>`<button class="rv ${S.know[i]?'on':''}" data-k="${i}" aria-expanded="${S.know[i]}"><span class="t">${c[0]}</span>${S.know[i]?`<span class="body">${c[1]}</span>`:'<span class="more">왜 스트레스가 될까?</span>'}</button>`).join('')}</div>
 </div>${nav()}`;},

signs(){const n=Object.values(S.signs).filter(Boolean).length;
 let res='';if(S.signsShown){
  res=n<=2?`<div class="fb good"><b>${n}개 체크했어요.</b> 지금은 비교적 잘 관리되고 있어요. 오늘 배울 호흡과 스트레칭으로 꾸준히 관리해 보세요.</div>`
  :n<=5?`<div class="fb info"><b>${n}개 체크했어요.</b> 스트레스가 쌓이고 있다는 신호예요. 휴식과 수면을 챙기고, 믿을 만한 동료나 상급자와 이야기를 나눠 보세요.</div>`
  :`<div class="fb badf"><b>${n}개 체크했어요.</b> 혼자 버티기 어려울 만큼 쌓였을 수 있어요. 이 교육 뒤쪽의 상담 창구에 꼭 한번 연락해 보세요. 이야기하는 것만으로도 도움이 돼요.</div>`;}
 return `<div class="panel"><div class="eyebrow">2. 내 신호 체크</div>
 <h2>최근 2주, <em>이런 적 있었나요?</em></h2>
 <p class="lead">해당하는 것을 눌러 체크해 보세요. 체크 결과는 이 화면에만 보이고 어디에도 저장되지 않아요. 진단이 아니라 나를 돌아보기 위한 점검이에요.</p>
 <div class="cols">${Object.entries(SIGNS).map(([cat,list])=>`<div class="col"><h3>${cat}</h3>${list.map((t,j)=>{const id=cat+j;return `<button class="sg ${S.signs[id]?'on':''}" data-s="${id}" aria-pressed="${!!S.signs[id]}"><span class="box">${check}</span><span>${t}</span></button>`;}).join('')}</div>`).join('')}</div>
 <div><button class="btn t" id="showSigns">결과 보기</button></div>
 ${res}
 </div>${nav()}`;},

breath(){const ok=canLeave(3);
 return `<div class="panel"><div class="eyebrow">3. 호흡 실습</div>
 <h2>싱잉볼 소리에 맞춰 <em>세 번만 숨 쉬어요</em></h2>
 <p class="lead">4초 들이쉬고, 4초 멈추고, 6초 동안 천천히 내쉬어요. 내쉬는 숨을 길게 하면 긴장한 몸이 풀리는 데 도움이 돼요. 판정 중 화가 나거나 긴장될 때 그 자리에서 바로 할 수 있어요.</p>
 ${task('호흡 시작을 눌러 세 번 따라 해 보세요 (약 40초). 바로 다음으로 넘어가도 돼요',S.breath>=3)}
 <div class="breath">
  <div class="orbwrap"><div class="ring"></div><div class="orb" id="orb"><span id="orbTx">준비</span></div></div>
  <div class="bctl"><div class="bigcount" id="bcount">-</div>
   <div class="cyc" aria-label="완료한 호흡 횟수">${[0,1,2].map(i=>`<i class="${S.breath>i?'on':''}"></i>`).join('')}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn t" id="bstart">${S.breath>=3?'한 번 더 하기':'호흡 시작'}</button><button class="btn line" id="bbowl">싱잉볼 울리기</button></div>
   <p style="font-size:.85rem;color:var(--muted)">눈을 감아도 괜찮아요. 싱잉볼 소리가 들숨이 시작될 때마다 울려요. 소리가 안 들리면 기기 볼륨과 무음 설정을 확인해 주세요.</p></div>
 </div></div>${nav()}`;},

stretch(){const ok=canLeave(4);
 return `<img class="hero" src="${IMG}" alt="">
 <div class="panel"><div class="eyebrow">4. 몸 풀기</div>
 <h2>몸이 풀리면 <em>마음도 풀려요</em></h2>
 <p class="lead">냉장실에서 오래 서 있으면 목·어깨·종아리가 굳어요. 판정 사이 쉬는 시간에 15초씩만 해 보세요. 아프면 바로 멈춰요.</p>
 ${task('세 동작을 각각 15초씩 따라 해 보세요',ok)}
 <div class="str">${STR.map((s,i)=>`<div class="sc ${S.stretch[i]?'done':''}"><span class="t">${i+1}. ${s[0]}</span><span class="d">${s[1]}</span><span class="bar"><i id="sb${i}" style="width:${S.stretch[i]?100:0}%"></i></span><button class="btn sm ${S.stretch[i]?'line':'t'}" data-st="${i}">${S.stretch[i]?'완료 · 다시 하기':'15초 시작'}</button></div>`).join('')}</div>
 </div>${nav()}`;},

cope(){const ok=canLeave(5);
 return `<div class="panel"><div class="eyebrow">5. 상황 대처</div>
 <h2>이럴 때 <em>어떻게 할까요?</em></h2>
 <p class="lead">평가사가 현장에서 실제로 겪을 수 있는 상황이에요. 나와 동료를 지키는 대처를 골라 보세요.</p>
 ${task('세 상황 모두 알맞은 대처를 고르세요',ok)}
 ${COPE.map((c,j)=>{const a=S.cope[j],r=a===c.a;return `<div class="note" style="color:var(--fg);display:flex;flex-direction:column;gap:10px"><b>상황 ${j+1}. ${c.s}</b>
 <div class="opts">${c.o.map((o,k)=>`<button class="opt ${a===k?(r?'right':'wrong'):''}" data-c="${j}" data-v="${k}" ${r?'disabled':''}>${o}</button>`).join('')}</div>
 ${a!==undefined?`<div class="fb ${r?'good':'badf'}">${r?c.e:'다시 생각해 보세요. 나를 지키면서 도움을 받을 수 있는 방법이 있어요.'}</div>`:''}</div>`;}).join('')}
 </div>${nav()}`;},

help(){return `<div class="panel"><div class="eyebrow">6. 도움 받기</div>
 <h2>힘들 때 <em>혼자 버티지 마세요</em></h2>
 <p class="lead">도움을 청하는 건 약해서가 아니라 나를 지키는 방법이에요. 가까운 곳부터 차례로 기억해 두세요.</p>
 <div class="help">
  <div class="hc"><span class="w">가장 가까이</span><span class="h">동료·상급자</span><span class="d">업무량, 일정, 민원 문제는 혼자 끌어안지 말고 팀장·지원장과 나눠요. 업무 배분 조정은 기관이 해야 할 일이에요.</span></div>
  <div class="hc"><span class="w">기관 안에서</span><span class="h">안전보건 담당 · 상담 프로그램</span><span class="d">기관에서 운영하는 심리상담(근로자지원프로그램 등)이 있다면 비밀이 보장되는 범위에서 이용할 수 있어요. 담당 부서에 이용 방법을 물어보세요.</span></div>
  <div class="hc"><span class="w">무료 상담</span><span class="h">근로자건강센터</span><span class="d">안전보건공단이 운영하는 센터에서 직무스트레스 상담을 받을 수 있어요. 가까운 센터는 안전보건공단 누리집에서 찾을 수 있어요.</span></div>
  <div class="hc"><span class="w">24시간 · 위기 상황</span><span class="h">자살예방 상담전화</span><span class="num">109</span><span class="d">마음이 너무 힘들거나 극단적인 생각이 들 때, 나 또는 주변 사람을 위해 언제든 전화할 수 있어요. 응급 상황이면 119·112로 연락하세요.</span></div>
 </div>
 </div>${nav('퀴즈 풀기 →')}`;},

quiz(){const Q=S.quiz;
 if(Q.i>=QUIZ.length)return V.end();
 const i=Q.i,q=QUIZ[i],a=Q.ans[i],done=a!==undefined;
 const opt=(j,inner)=>{let c='';if(done){if(j===q.a)c='right';else if(j===a)c='wrong';}return `<button class="opt ${c}" data-a="${j}" ${done?'disabled':''}>${inner}</button>`;};
 return `<div class="panel"><div class="eyebrow">확인 퀴즈</div>
 <div class="qhead"><span>문제 ${i+1} / ${QUIZ.length}</span><span>맞힌 문제 ${score()}</span></div>
 <div class="qbar"><i style="width:${Q.ans.length/QUIZ.length*100}%"></i></div>
 <h2 style="font-size:clamp(1.25rem,3.2vw,1.6rem)">${q.q}</h2>
 ${q.t==='ox'?`<div class="ox">${opt(0,'O')}${opt(1,'X')}</div>`:`<div class="qopts">${q.o.map((o,j)=>opt(j,`<span class="l">${j+1}</span><span>${o}</span>`)).join('')}</div>`}
 ${done?`<div class="fb ${a===q.a?'good':'badf'}"><b>${a===q.a?'정답이에요.':'아쉬워요. 정답은 '+(q.t==='ox'?(q.a?'X':'O'):(q.a+1)+'번')+'이에요.'}</b> ${q.e}</div><div><button class="btn pri" id="qn">${i<QUIZ.length-1?'다음 문제 →':'결과 보기 →'}</button></div>`:''}
 </div>${nav()}`;},

end(){const sc=score(),pass=sc>=4,d=new Date(),ds=`${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`;
 return `<img class="hero" src="${IMG}" alt="">
 <div class="panel"><div class="eyebrow">교육 완료</div>
 <div class="cert"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div style="font-weight:700">스트레스 예방 교육</div><div style="color:var(--muted);font-size:.9rem">퀴즈 점수</div></div><div class="score">${sc} / ${QUIZ.length}</div></div>
 <div class="fb ${pass?'good':'badf'}">${pass?'이수 기준(4문제 이상)을 통과했어요. 오늘 하루, 숨 한 번 길게 내쉬고 시작해요.':'이수 기준은 4문제 이상이에요. 아래 버튼으로 퀴즈를 다시 풀어 보세요.'}</div>
 <label for="nm" style="font-weight:700;font-size:.9rem">교육 이수자 이름</label>
 <input type="text" id="nm" placeholder="이름 입력" value="${S.name.replace(/"/g,'&quot;')}">
 <div class="row"><span>교육일 ${ds}</span><span id="nmv">${S.name?'이수자 '+S.name:''}</span><span>축산물품질평가원 서울지원</span></div></div>
 <ul class="summary"><li><b>알아차리기</b>몸·마음·행동의 신호</li><li><b>호흡</b>4초 들숨 · 4초 멈춤 · 6초 날숨</li><li><b>대처</b>폭언은 멈추고 알리기</li><li><b>도움</b>동료·상급자 · 근로자건강센터 · 109</li></ul>
 ${pass?'':'<div><button class="btn t" id="retry">퀴즈 다시 풀기</button></div>'}
 <div class="src">근거: 산업안전보건법 제5조(사업주의 의무)·제41조(고객의 폭언 등으로 인한 건강장해 예방조치), 산업안전보건기준에 관한 규칙 제669조(직무스트레스에 의한 건강장해 예방 조치).</div>
 </div>${nav()}`;}
};

function runBreath(){
 stopAll();const orb=document.getElementById('orb'),tx=document.getElementById('orbTx'),cnt=document.getElementById('bcount'),btn=document.getElementById('bstart');
 const PH=[['들이쉬기',4,'72%'],['멈추기',4,'72%'],['내쉬기',6,'40%']];let cyc=0,ph=0,left=PH[0][1];btn.disabled=true;
 const startS=S.breath>=3?0:S.breath;let done=0;
 function apply(){const p=PH[ph];tx.textContent=p[0];orb.style.transitionDuration=p[1]+'s';orb.style.width=p[2];cnt.textContent=left+'초';if(ph===0&&left===p[1])bowl();}
 apply();
 const t=setInterval(()=>{left--;if(left<=0){ph++;if(ph>=PH.length){ph=0;cyc++;done++;S.breath=Math.max(S.breath,startS+done);
   document.querySelectorAll('.cyc i').forEach((el,i)=>el.classList.toggle('on',S.breath>i));
   if(cyc>=3){clearInterval(t);tx.textContent='잘했어요';cnt.textContent='완료';orb.style.width='40%';btn.disabled=false;btn.textContent='한 번 더 하기';refreshNext();renderRail();const tk=document.querySelector('.task');if(tk){tk.className='task ok';tk.textContent='완료! 다음 단계로 넘어갈 수 있어요';}return;}}
   left=PH[ph][1];}apply();},1000);
 timers.push(t);
}
function runStretch(i){
 const bar=document.getElementById('sb'+i),btns=document.querySelectorAll('[data-st]');btns.forEach(b=>b.disabled=true);let s=0;bar.style.width='0%';
 const t=setInterval(()=>{s++;bar.style.width=(s/15*100)+'%';btns[i].textContent=(15-s)+'초';if(s>=15){clearInterval(t);S.stretch[i]=true;bowl();render();}},1000);timers.push(t);
}

function render(){renderRail();const st=document.getElementById('stage');st.innerHTML=V[STEPS[S.cur].k]();
 const $=id=>document.getElementById(id);
 if($('prev'))$('prev').onclick=()=>go(S.cur-1);
 if($('next'))$('next').onclick=()=>{if(canLeave(S.cur))go(S.cur+1);};
 if($('restart'))$('restart').onclick=()=>{S=init();render();};
 st.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.know[+b.dataset.k]=true;render();});
 st.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const id=b.dataset.s;S.signs[id]=!S.signs[id];b.classList.toggle('on',S.signs[id]);b.setAttribute('aria-pressed',S.signs[id]);if(S.signsShown)render();});
 if($('showSigns'))$('showSigns').onclick=()=>{S.signsShown=true;render();};
 if($('bstart'))$('bstart').onclick=runBreath;
 if($('bbowl'))$('bbowl').onclick=bowl;
 st.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>runStretch(+b.dataset.st));
 st.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cope[+b.dataset.c]=+b.dataset.v;render();});
 st.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=S.quiz.i;if(S.quiz.ans[i]!==undefined)return;S.quiz.ans[i]=+b.dataset.a;render();});
 if($('qn'))$('qn').onclick=()=>{S.quiz.i++;render();};
 if($('retry'))$('retry').onclick=()=>{S.quiz={i:0,ans:[]};render();};
 const nm=$('nm');if(nm)nm.oninput=()=>{S.name=nm.value.trim();$('nmv').textContent=S.name?'이수자 '+S.name:'';};
}
render();
</script>
